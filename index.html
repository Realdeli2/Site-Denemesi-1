<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelitlibağ FC 26 - Yönetim Paneli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PELİTLİBAĞ FC 26</h1>
    <!-- SEKMELER -->
    <nav class="main-nav">
      <button class="nav-btn active" data-tab="cards">🃏 Kartlar</button>
      <button class="nav-btn" data-tab="training">🏋️ Tesisler</button>
      <button class="nav-btn" data-tab="matches">⚽ Maçlar</button>
    </nav>
  </header>

  <!-- SEKME 1: KARTLAR -->
  <section id="tab-cards" class="tab-content active">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Oyuncu ara...">
      <select id="posFilter">
        <option value="ALL">Tüm Pozisyonlar</option>
        <option value="GK">GK (Kaleci)</option>
        <option value="CB">CB (Stoper)</option>
        <option value="RB">RB (Sağ Bek)</option>
        <option value="CAM">CAM (Ofansif OS)</option>
        <option value="ST">ST (Forvet)</option>
      </select>
    </div>
    <main class="card-container" id="cardContainer"></main>
  </section>

  <!-- SEKME 2: ANTRENMAN TESİSLERİ -->
  <section id="tab-training" class="tab-content">
    <div class="training-header">
      <h2>🏋️ ANTRENMAN TESİSLERİ</h2>
      <p>Kategori seç, oyuncunu belirle, antrenmanı başlat ve 10 dk sonra verimi al!</p>
    </div>
    <div id="trainingContainer" class="training-grid"></div>
  </section>

  <!-- SEKME 3: MAÇLAR -->
  <section id="tab-matches" class="tab-content">
    <div class="training-header">
      <h2>⚽ MAÇ MERKEZİ</h2>
      <p>Takımını maça çıkar, galibiyet serisi yakala!</p>
    </div>
    <div style="text-align: center; margin-top: 30px;">
      <button class="btn-rest" onclick="playMatch()" style="padding: 15px 30px; font-size: 1.1rem;">Maç Yap (Simülasyon)</button>
      <div id="matchResult" style="margin-top: 20px; font-size: 1.2rem; color: #e5b350;"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
                                         </html>
