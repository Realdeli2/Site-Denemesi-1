<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pelitlibağ FC 26 - Yönetim Paneli</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>PELİTLİBAĞ FC 26</h1>
    <!-- SEKMELER (TAB NAVIGASYON) -->
    <nav class="main-nav">
      <button class="nav-btn active" data-tab="cards">🃏 Bütün Kartlar</button>
      <button class="nav-btn" data-tab="training">🏋️ Antrenman Tesisleri</button>
    </nav>
  </header>

  <!-- SEKME 1: KART LİSTESİ -->
  <section id="tab-cards" class="tab-content active">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Oyuncu ara...">
      <select id="posFilter">
        <option value="ALL">Tüm Pozisyonlar</option>
        <option value="GK">GK (Kaleci)</option>
        <option value="CB">CB (Stoper)</option>
        <option value="RB">RB (Sağ Bek)</option>
        <option value="CAM">CAM (Ofansif OS)</option>
        <option value="ST">ST (Forvet)</option>
      </select>
    </div>
    <main class="card-container" id="cardContainer"></main>
  </section>

  <!-- SEKME 2: ANTRENMAN VE GELİŞİM -->
  <section id="tab-training" class="tab-content">
    <div class="training-header">
      <h2>🏋️ ANTRENMAN VE OYUNCU GELİŞİMİ</h2>
      <p>İstatistik butonlarına basarak oyuncularını geliştir, seviyelerini atlat!</p>
    </div>
    <div id="trainingContainer" class="training-grid"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
